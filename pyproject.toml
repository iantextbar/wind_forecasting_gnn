[project]
name = "wind-forecasting-gnn"
version = "0.1.0"
description = "Spatio-temporal GNN forecasting of hourly wind-power output in the Brazilian grid, with weather-driven edges."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Code lives in src/scripts; it installs as the top-level package `scripts`.
packages = ["src/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# pycodestyle (PEP 8) errors and warnings, pyflakes, import sorting,
# bugbear (likely bugs), pyupgrade (modern syntax).
select = ["E", "W", "F", "I", "B", "UP"]
